<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH3 BUNNY — Coder & Developer</title>

<!-- Google Fonts: Space Grotesk (display/headline), Inter (body), JetBrains Mono (code accents) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================
     DESIGN TOKENS
  ============================================ */
  :root{
    --white:        #ffffff;
    --bg-soft:       #f6faf7;      /* very light green-gray page tint */
    --ink:           #0e1f16;      /* near-black w/ green undertone, for headlines */
    --ink-soft:      #4b5a52;      /* secondary text */
    --green:         #16a34a;      /* vibrant crisp green — primary accent */
    --green-dark:    #0d7a38;      /* hover / pressed state */
    --green-tint:    #e7f7ec;      /* soft fill / card backgrounds */
    --green-border:  #cdeed9;      /* subtle borders */
    --mono-tag-bg:   #f0faf3;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body:    'Inter', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;

    --container-w: 1160px;
    --radius-lg: 24px;
    --radius-md: 14px;
    --radius-full: 999px;
  }

  /* ============================================
     RESET
  ============================================ */
  *, *::before, *::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg-soft);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img{ max-width: 100%; display: block; }
  a{ text-decoration: none; color: inherit; }
  ul{ list-style: none; margin: 0; padding: 0; }
  button{ font-family: inherit; cursor: pointer; }

  /* Visible keyboard focus for accessibility */
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 3px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .container{
    width: 100%;
    max-width: var(--container-w);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ============================================
     NAVBAR
  ============================================ */
  .navbar{
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--green-border);
    transition: box-shadow 0.25s ease;
  }
  .navbar.scrolled{
    box-shadow: 0 4px 24px rgba(16,36,28,0.06);
  }
  .nav-inner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 76px;
  }
  .logo{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }

  /* the <nav> wrapper itself must also be flex so it doesn't
     collapse to a block box and push the <ul> onto its own line */
  .nav-inner nav{
    display: flex;
    align-items: center;
  }

  .nav-links{
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    gap: 36px;
    margin: 0;
    padding: 0;
  }
  .nav-links li{
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .nav-links a:not(.btn-cta){
    position: relative;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 6px 0;
    transition: color 0.2s ease;
  }
  .nav-links a:not(.btn-cta)::after{
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 0%;
    height: 2px;
    background: var(--green);
    transition: width 0.25s ease;
    border-radius: 2px;
  }
  .nav-links a:not(.btn-cta):hover{
    color: var(--ink);
  }
  .nav-links a:not(.btn-cta):hover::after{
    width: 100%;
  }

  .btn-cta{
    background: var(--green);
    color: var(--white) !important;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 10px 22px;
    border-radius: var(--radius-full);
    box-shadow: 0 6px 18px rgba(22,163,74,0.28);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn-cta:hover{
    background: var(--green-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(22,163,74,0.36);
  }

  /* Mobile nav toggle */
  .nav-toggle{
    display: none;
    background: none;
    border: none;
    width: 40px;
    height: 40px;
    position: relative;
  }
  .nav-toggle span,
  .nav-toggle span::before,
  .nav-toggle span::after{
    content: '';
    position: absolute;
    left: 8px;
    right: 8px;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .nav-toggle span{ top: 19px; }
  .nav-toggle span::before{ top: -7px; }
  .nav-toggle span::after{ top: 7px; }
  .nav-toggle.active span{ background: transparent; }
  .nav-toggle.active span::before{ transform: translateY(7px) rotate(45deg); }
  .nav-toggle.active span::after{ transform: translateY(-7px) rotate(-45deg); }

  /* ============================================
     HERO SECTION
  ============================================ */
  .hero{
    padding: 96px 0 110px;
    overflow: hidden;
    position: relative;
  }
  /* soft ambient green glow, kept subtle per "premium" restraint */
  .hero::before{
    content: '';
    position: absolute;
    top: -180px;
    right: -160px;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(22,163,74,0.14) 0%, rgba(22,163,74,0) 70%);
    pointer-events: none;
  }

  .hero-grid{
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 64px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* ---- Left: photo ---- */
  .hero-photo-wrap{
    position: relative;
    width: 100%;
    max-width: 360px;
    justify-self: center;
  }
  .hero-photo-ring{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    padding: 10px;
    background: var(--white);
    border: 3px solid var(--green);
    box-shadow: 0 20px 50px rgba(16,36,28,0.10), 0 0 0 10px var(--green-tint);
  }
  .hero-photo-ring img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: var(--green-tint);
  }
  /* dashed rotating ring — signature detail, echoes a compiling/loading state */
  .hero-photo-dashring{
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 2px dashed var(--green-border);
    animation: spin 26s linear infinite;
    pointer-events: none;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .hero-status-badge{
    position: absolute;
    bottom: 6%;
    right: -6%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid var(--green-border);
    padding: 9px 16px;
    border-radius: var(--radius-full);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink);
    box-shadow: 0 10px 28px rgba(16,36,28,0.08);
  }
  .hero-status-badge .pulse{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    position: relative;
  }
  .hero-status-badge .pulse::after{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform: scale(1); opacity: 0.7; }
    100%{ transform: scale(2.6); opacity: 0; }
  }

  /* ---- Right: text content ---- */
  .hero-content{ max-width: 560px; }

  .hero-eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--green-dark);
    background: var(--mono-tag-bg);
    border: 1px solid var(--green-border);
    padding: 7px 14px;
    border-radius: var(--radius-full);
    margin-bottom: 26px;
  }
  .hero-eyebrow .bracket{ color: var(--green); font-weight: 500; }

  .hero-title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 18px;
  }
  .hero-title .accent{
    color: var(--green);
  }
  /* blinking terminal-style cursor, small signature touch tying to "coder" identity */
  .cursor{
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: var(--green);
    margin-left: 6px;
    vertical-align: -0.08em;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .hero-subtitle{
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--ink-soft);
    margin: 0 0 36px;
    font-style: italic;
  }

  .hero-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .btn-primary{
    background: var(--green);
    color: var(--white);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 15px 30px;
    border-radius: var(--radius-full);
    box-shadow: 0 10px 24px rgba(22,163,74,0.28);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn-primary:hover{
    background: var(--green-dark);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(22,163,74,0.36);
  }

  .btn-secondary{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--ink);
    padding: 15px 6px;
    border-bottom: 2px solid var(--green-border);
    transition: border-color 0.2s ease, color 0.2s ease, gap 0.2s ease;
  }
  .btn-secondary:hover{
    border-color: var(--green);
    color: var(--green-dark);
    gap: 12px;
  }

  /* ============================================
     RESPONSIVE
  ============================================ */

  /* Tablet */
  @media (max-width: 900px){
    .hero-grid{
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      gap: 48px;
    }
    .hero-photo-wrap{ max-width: 300px; }
    .hero-content{ max-width: 640px; }
    .hero-actions{ justify-content: center; }
    .hero-eyebrow{ margin-left: auto; margin-right: auto; }
  }

  /* Mobile nav collapse */
  @media (max-width: 760px){
    .nav-toggle{ display: block; }
    .nav-links{
      position: absolute;
      top: 76px;
      left: 0;
      right: 0;
      background: var(--white);
      border-bottom: 1px solid var(--green-border);
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 0;
      padding: 8px 24px 20px;
      transform: translateY(-12px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .nav-links.open{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
      box-shadow: 0 16px 30px rgba(16,36,28,0.08);
    }
    .nav-links li{
      width: 100%;
    }
    .nav-links a:not(.btn-cta){
      width: 100%;
      padding: 14px 0;
      border-bottom: 1px solid var(--green-tint);
    }
    .nav-links .btn-cta{
      margin-top: 14px;
      text-align: center;
      justify-content: center;
    }
  }

  /* Small mobile */
  @media (max-width: 480px){
    .hero{ padding: 64px 0 72px; }
    .hero-subtitle{ font-size: 1.02rem; }
    .hero-status-badge{ right: 0; font-size: 0.7rem; padding: 7px 12px; }
    .hero-actions{ flex-direction: column; align-items: stretch; }
    .btn-primary, .btn-secondary{ text-align: center; justify-content: center; }
  }
</style>
</head>
<body>

  <!-- ============================================
       NAVIGATION BAR
  ============================================ -->
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#" class="logo"><span class="dot"></span>TH3 BUNNY</a>

      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="#projects">Project</a></li>
          <li><a href="#about">About Me</a></li>
          <li><a href="#contact">My Contact</a></li>
          <li><a href="#contact" class="btn-cta">Hire Me</a></li>
        </ul>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
      </button>
    </div>
  </header>

  <!-- ============================================
       HERO / LANDING SECTION
  ============================================ -->
  <section class="hero" id="hero">
    <div class="container hero-grid">

      <!-- Left: profile photo -->
      <div class="hero-photo-wrap">
        <div class="hero-photo-dashring"></div>
        <div class="hero-photo-ring">
          <!-- Profile photo -->
          <img src="https://cdnfiles.zone.id/img/zkndmnvbni9qlrwfnnkv.png" alt="Portrait of TH3 BUNNY">
        </div>
        <div class="hero-status-badge">
          <span class="pulse"></span> available_for_work
        </div>
      </div>

      <!-- Right: text content -->
      <div class="hero-content">
        <span class="hero-eyebrow"><span class="bracket">&lt;</span>portfolio<span class="bracket">/&gt;</span></span>

        <h1 class="hero-title">
          Hi, I'm <span class="accent">TH3 BUNNY</span><span class="cursor"></span>
        </h1>

        <p class="hero-subtitle">I am a coder &amp; developer</p>

        <div class="hero-actions">
          <a href="#projects" class="btn-primary">View My Work</a>
          <a href="#contact" class="btn-secondary">Get in touch →</a>
        </div>
      </div>

    </div>
  </section>

  <!-- ABOUT ME SECTION WILL GO HERE -->

  <!-- PROJECTS SECTION WILL GO HERE -->

  <!-- CONTACT SECTION WILL GO HERE -->

  <!-- FOOTER SECTION WILL GO HERE -->

  <script>
    // ============================================
    // NAVBAR: shadow on scroll
    // ============================================
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 8);
    });

    // ============================================
    // MOBILE NAV: toggle menu open/close
    // ============================================
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');

    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      navToggle.classList.toggle('active', isOpen);
      navToggle.setAttribute('aria-expanded', isOpen);
    });

    // Close mobile menu after a link is tapped
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('open');
        navToggle.classList.remove('active');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
